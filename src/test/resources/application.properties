# --- TEST ENVIRONMENT (H2 Database) ---
# File này CHỈ được load khi chạy mvn test. Nó không ảnh hưởng đến Oracle khi chạy App thật.

# 1. Ép dùng H2 thay vì Oracle
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=Oracle
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Cấu hình Hibernate cho H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Quan trọng: create-drop để tự tạo bảng khi test bắt đầu và xóa khi test xong
spring.jpa.hibernate.ddl-auto=create-drop 

# 3. Tắt Liquibase khi test (vì H2 sẽ tự tạo bảng qua ddl-auto, ko cần Liquibase chạy script Oracle)
spring.liquibase.enabled=false

# 4. Mock các biến môi trường khác để Test không bị lỗi thiếu Config
jwt.secret.key=test-secret-key-must-be-very-long-for-hmac-sha-256-at-least-32-bytes
jwt.expiration.ms=3600000

# Mock các External Service (Jira, Zoho...) để test không cố kết nối thật
jira.base-url=http://mock-jira.com
jira.email=test@test.com
jira.api-token=test

firebase.bucket-name=test-bucket

zoho.client-id=test
zoho.client-secret=test
zoho.redirect-uri=http://localhost:8080/test
zoho.accounts-url=http://mock-zoho.com
zoho.api-url=http://mock-zoho-api.com
zoho.scopes=test

slack.webhook.url=http://mock-slack.com

intuit.oauth2.clientId=test
intuit.oauth2.clientSecret=test
intuit.oauth2.redirectUri=http://localhost
intuit.oauth2.authorizationUrl=http://localhost
intuit.oauth2.tokenUrl=http://localhost
intuit.oauth2.scopes=test
intuit.oauth2.apiUrl=http://localhost
intuit.accounting.default-expense-account-id=1